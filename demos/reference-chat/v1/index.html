<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference chat v1 — control · Acme UI</title>
<style>
  :root {
    --bg: #faf9f7; --surface: #ffffff; --ink: #1a1a1a; --ink-soft: #6b6a66;
    --line: #e4e2dd; --accent: #0d5c4d; --accent-ink: #ffffff;
    --stop: #a33d2f; --stop-ink: #ffffff;
    --user-bg: #eceae4; --tool-bg: #f4f2ec;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --surface:#1d1c1b; --ink:#ececea; --ink-soft:#98968f;
      --line:#2e2d2a; --accent:#4fb39a; --accent-ink:#10201b;
      --stop:#d06b5c; --stop-ink:#1d1c1b;
      --user-bg:#262523; --tool-bg:#21201e; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans);
    height: 100dvh; display: flex; flex-direction: column; }
  header { padding: .8rem 1.25rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: .8rem; }
  header a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: .75rem; }
  header .tag { font-family: var(--mono); font-weight: 700; }
  header .note { color: var(--ink-soft); font-size: .8rem; }
  #log { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex;
    flex-direction: column; gap: .8rem; max-width: 46rem; width: 100%; margin: 0 auto; }
  .msg { padding: .6rem .9rem; border-radius: 6px; white-space: pre-wrap;
    line-height: 1.5; font-size: .95rem; }
  .user { background: var(--user-bg); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--surface); border: 1px solid var(--line); align-self: stretch; }
  .tool { background: var(--tool-bg); border: 1px dashed var(--line);
    font-family: var(--mono); font-size: .8rem; color: var(--ink-soft); }
  .stopped { font-family: var(--mono); font-size: .75rem; color: var(--ink-soft);
    padding: 0 .2rem; }
  form { border-top: 1px solid var(--line); padding: .9rem 1.25rem; }
  .row { display: flex; gap: .6rem; max-width: 46rem; margin: 0 auto; }
  input { flex: 1; font: inherit; padding: .55rem .8rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button { font: inherit; padding: .55rem 1.1rem; border-radius: 6px; border: none;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; min-width: 4.6rem; }
  button.stop { background: var(--stop); color: var(--stop-ink); }
</style>
</head>
<body>
<header>
  <a href="https://acme-ui.eidosagi.com/">acme ui</a>
  <a href="../">&larr; versions</a>
  <span class="tag">v1</span>
  <span class="note">control — Stop works, partials survive, late tokens dropped. Still raw dumps and scroll yanks: that's v2 and v3.</span>
</header>

<div id="log"></div>

<form id="composer">
  <div class="row">
    <input id="box" value="Audit the repo's broken links and fix them" autocomplete="off">
    <button id="btn" type="submit">Send</button>
  </div>
</form>

<script src="../../mock-ai/v1.js"></script>
<script>
// v1 fixes CONTROL on top of v0: send/stop same-slot morph, abort keeps the
// partial, and events for a dead turn are dropped (late-token suppression,
// keyed on turn_id — the trap the mock sets after stop()).
// Still v0-crude on purpose: raw tool dumps inline (v2), scroll yank +
// error grace (v3).
const log = document.getElementById("log");
const box = document.getElementById("box");
const btn = document.getElementById("btn");
const agent = MockAI.v1();
let current = null;      // current assistant bubble
let liveTurn = null;     // turn_id we accept events for
let handle = null;       // {stop()} for the live turn
const dead = new Set();  // turns past their terminal event

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight; // still yanks — v3 fixes scroll
  return d;
}

function setBusy(busy) {
  btn.textContent = busy ? "Stop" : "Send";
  btn.classList.toggle("stop", busy);
  box.disabled = busy;
  if (!busy) box.focus();
}

function endTurn(turn_id) {
  dead.add(turn_id);
  liveTurn = null;
  handle = null;
  setBusy(false);
}

function onEvent(ev) {
  if (dead.has(ev.turn_id)) return;           // late-token suppression
  if (liveTurn !== null && ev.turn_id !== liveTurn) return;
  if (ev.type === "turn_start") {
    liveTurn = ev.turn_id;
    current = add("assistant", "");
  } else if (ev.type === "text") {
    if (!current) current = add("assistant", "");
    current.textContent += ev.text;
    log.scrollTop = log.scrollHeight;
  } else if (ev.type === "tool_use") {
    add("tool", "▸ " + ev.name + ": " + ev.label + " …");
    current = null;
  } else if (ev.type === "tool_result") {
    // still the v0 sin: full dump inline — v2 collapses this
    add("tool", ev.content + "\n(" + ev.metrics.duration_ms + "ms)");
    current = null;
  } else if (ev.type === "abort") {
    if (current && !current.textContent) current.remove();
    add("stopped", "⏹ stopped — partial response kept");
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "done") {
    if (current && !current.textContent) current.remove();
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "error" && !ev.recoverable) {
    add("tool", "error: " + ev.text);
    current = null;
    endTurn(ev.turn_id);
  } else {
    // recoverable error still rendered crudely — v3 makes this calm
    add("tool", JSON.stringify(ev));
  }
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (handle) {                     // button is in Stop mode (armed from send, not turn_start)
    handle.stop();
    return;
  }
  if (!box.value.trim()) return;
  add("user", box.value);
  box.value = "";
  setBusy(true);
  handle = agent.send("", onEvent);
});

// shell autoplay: the shell posts "acme-play" when its countdown veil lifts
if (new URLSearchParams(location.search).has("autoplay")) {
  let played = false;
  const play = () => {
    if (played) return; played = true;
    const b = document.getElementById("btn");
    if (b && !b.disabled) b.click();
  };
  window.addEventListener("message", (e) => { if (e.data === "acme-play") play(); });
  if (top === self) setTimeout(play, 800);
}
</script>
</body>
</html>
