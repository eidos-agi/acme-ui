<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference chat v3 — tool disclosure · Acme UI</title>
<style>
  :root {
    --bg: #faf9f7; --surface: #ffffff; --ink: #1a1a1a; --ink-soft: #6b6a66;
    --line: #e4e2dd; --accent: #0d5c4d; --accent-ink: #ffffff;
    --stop: #a33d2f; --stop-ink: #ffffff;
    --tool-bg: #f4f2ec;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141413; --surface:#1d1c1b; --ink:#ececea; --ink-soft:#98968f;
      --line:#2e2d2a; --accent:#4fb39a; --accent-ink:#10201b;
      --stop:#d06b5c; --stop-ink:#1d1c1b; --tool-bg:#21201e; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans);
    height: 100dvh; display: flex; flex-direction: column; }
  header { padding: .8rem 1.25rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: .8rem; }
  header a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: .75rem; }
  header .tag { font-family: var(--mono); font-weight: 700; }
  header .note { color: var(--ink-soft); font-size: .8rem; }
  #log { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex;
    flex-direction: column; gap: .8rem; max-width: 46rem; width: 100%; margin: 0 auto; }
  .msg { padding: .6rem .9rem; border-radius: 6px; white-space: pre-wrap;
    line-height: 1.5; font-size: .95rem; }
  .user { background: var(--accent); color: var(--accent-ink); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; max-width: 85%; }
  .stopped { font-family: var(--mono); font-size: .75rem; color: var(--ink-soft); padding: 0 .2rem; }

  /* v3: tool rows — glanceable head, smoothly expanding body */
  .toolrow { align-self: flex-start; max-width: 85%; min-width: 18rem;
    border: 1px solid var(--line); border-radius: 6px; background: var(--tool-bg); }
  .toolhead { display: flex; align-items: center; gap: .55rem; width: 100%;
    font-family: var(--mono); font-size: .8rem; color: var(--ink-soft);
    background: none; border: none; padding: .5rem .75rem; cursor: pointer; text-align: left; }
  .chev { display: inline-block; transition: transform .2s ease; font-size: .7rem; }
  .toolrow.open .chev { transform: rotate(90deg); }
  .tname { color: var(--ink); font-weight: 700; }
  .tlabel { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tstate { white-space: nowrap; }
  .tstate.ok { color: var(--accent); }
  .tstate.err { color: var(--stop); }
  .spinner { width: .8em; height: .8em; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; display: inline-block;
    animation: spin .7s linear infinite; vertical-align: -.1em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toolbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .22s ease; }
  .toolbody > .inner { overflow: hidden; min-height: 0; }
  .toolrow.open .toolbody { grid-template-rows: 1fr; }
  .toolbody pre { font-family: var(--mono); font-size: .75rem; line-height: 1.5;
    color: var(--ink-soft); padding: 0 .75rem .6rem 2rem; white-space: pre-wrap;
    border-top: 1px dashed var(--line); margin: 0 0 0 0; padding-top: .5rem; }

  form { border-top: 1px solid var(--line); padding: .9rem 1.25rem; }
  .row { display: flex; gap: .6rem; max-width: 46rem; margin: 0 auto; }
  input { flex: 1; font: inherit; padding: .55rem .8rem; border-radius: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button.primary { font: inherit; padding: .55rem 1.1rem; border-radius: 6px; border: none;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; min-width: 4.6rem; }
  button.primary.stop { background: var(--stop); color: var(--stop-ink); }
</style>
</head>
<body>
<header>
  <a href="https://acme-ui.eidosagi.com/">acme ui</a>
  <a href="../">&larr; versions</a>
  <span class="tag">v3</span>
  <span class="note">tool disclosure — activity at a glance, detail one click away. Scroll yank and crude errors still ahead (v4, v5).</span>
</header>

<div id="log"></div>

<form id="composer">
  <div class="row">
    <input id="box" value="Audit the repo's broken links and fix them" autocomplete="off">
    <button id="btn" type="submit" class="primary">Send</button>
  </div>
</form>

<script src="../../mock-ai/v1.js"></script>
<script>
// v3 fixes DISCLOSURE on top of v2: tool activity renders as a collapsed row
// (name + label + live state), the full input/result stays one click away
// behind a smooth grid-rows expand. Raw dumps are gone; nothing is forced on
// the reader. Still deliberate: scroll yank (v4), crude error JSON (v5).
const log = document.getElementById("log");
const box = document.getElementById("box");
const btn = document.getElementById("btn");
const agent = MockAI.v1();
let current = null;
let liveTurn = null;
let handle = null;
const dead = new Set();
const tools = new Map(); // tool_use_id -> {row, state, pre}

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight; // still yanks — v4 fixes scroll
  return d;
}

function fmtMs(ms) { return ms >= 1000 ? (ms / 1000).toFixed(1) + "s" : ms + "ms"; }

function addToolRow(ev) {
  const row = document.createElement("div");
  row.className = "toolrow";
  const head = document.createElement("button");
  head.className = "toolhead";
  head.type = "button";
  head.innerHTML = '<span class="chev">▸</span><span class="tname"></span>' +
    '<span class="tlabel"></span><span class="tstate"><span class="spinner"></span></span>';
  head.querySelector(".tname").textContent = ev.name;
  head.querySelector(".tlabel").textContent = ev.label;
  const body = document.createElement("div");
  body.className = "toolbody";
  const inner = document.createElement("div");
  inner.className = "inner";
  const pre = document.createElement("pre");
  pre.textContent = "input: " + JSON.stringify(ev.input || {}, null, 2);
  inner.appendChild(pre);
  body.appendChild(inner);
  row.appendChild(head);
  row.appendChild(body);
  head.addEventListener("click", () => row.classList.toggle("open"));
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  tools.set(ev.tool_use_id, { row, state: head.querySelector(".tstate"), pre });
}

function resolveToolRow(ev) {
  const t = tools.get(ev.tool_use_id);
  if (!t) return;
  const ok = ev.status === "ok";
  t.state.className = "tstate " + (ok ? "ok" : "err");
  t.state.textContent = (ok ? "✓" : "✗") + " " + fmtMs(ev.metrics.duration_ms);
  t.pre.textContent = ev.content;
}

function setBusy(busy) {
  btn.textContent = busy ? "Stop" : "Send";
  btn.classList.toggle("stop", busy);
  box.disabled = busy;
  if (!busy) box.focus();
}

function endTurn(turn_id) {
  dead.add(turn_id);
  liveTurn = null;
  handle = null;
  setBusy(false);
}

function onEvent(ev) {
  if (dead.has(ev.turn_id)) return;           // late-token suppression
  if (liveTurn !== null && ev.turn_id !== liveTurn) return;
  if (ev.type === "turn_start") {
    liveTurn = ev.turn_id;
    current = add("assistant", "");
  } else if (ev.type === "text") {
    if (!current) current = add("assistant", "");
    current.textContent += ev.text;
    log.scrollTop = log.scrollHeight;
  } else if (ev.type === "tool_use") {
    addToolRow(ev);
    current = null;
  } else if (ev.type === "tool_result") {
    resolveToolRow(ev);
    current = null;
  } else if (ev.type === "abort") {
    if (current && !current.textContent) current.remove();
    add("stopped", "⏹ stopped — partial response kept");
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "done") {
    if (current && !current.textContent) current.remove();
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "error" && !ev.recoverable) {
    add("stopped", "error: " + ev.text);
    current = null;
    endTurn(ev.turn_id);
  } else {
    // recoverable error still rendered crudely — v5 makes this calm
    add("stopped", JSON.stringify(ev));
  }
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (handle) { handle.stop(); return; }
  if (!box.value.trim()) return;
  add("user", box.value);
  box.value = "";
  setBusy(true);
  handle = agent.send("", onEvent);
});

// shell autoplay: ?autoplay=1 plays the scripted turn after the countdown veil
if (new URLSearchParams(location.search).has("autoplay")) {
  setTimeout(() => {
    const b = document.getElementById("btn");
    if (b && !b.disabled) b.click();
  }, 2400);
}
</script>
</body>
</html>
