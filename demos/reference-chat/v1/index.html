<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference chat v1 — control · Eidos UI</title>
<link rel="stylesheet" href="/brand.css?v=3">
<link rel="stylesheet" href="/demos/reference-chat/_base.css?v=3">
<style>
  /* v1 lesson adds control; bubbles still ambiguous (fixed in v2) */
  .user { background: var(--user-bg); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--surface); border: 1px solid var(--line); align-self: stretch; }
  .tool { background: var(--tool-bg); border: 1px dashed var(--line);
    font-family: var(--mono); font-size: .8rem; color: var(--ink-soft); }
</style>
</head>
<body>
<header>
  <a href="https://ui.eidosagi.com/">eidos ui</a>
  <a href="../">&larr; versions</a>
  <span class="tag">v1</span>
  <span class="note">control — Stop works, partials survive, late tokens dropped. Still raw dumps and scroll yanks: that's v2 and v3.</span>
</header>

<div id="log"></div>

<form id="composer">
  <div class="row">
    <input id="box" value="Audit the repo's broken links and fix them" autocomplete="off">
    <button id="btn" type="submit">Send</button>
  </div>
</form>

<script src="/demos/mock-ai/v1.js?v=3"></script>
<script>
// v1 fixes CONTROL on top of v0: send/stop same-slot morph, abort keeps the
// partial, and events for a dead turn are dropped (late-token suppression,
// keyed on turn_id — the trap the mock sets after stop()).
// Still v0-crude on purpose: raw tool dumps inline (v2), scroll yank +
// error grace (v3).
const log = document.getElementById("log");
const box = document.getElementById("box");
const btn = document.getElementById("btn");
const agent = MockAI.v1();
let current = null;      // current assistant bubble
let liveTurn = null;     // turn_id we accept events for
let handle = null;       // {stop()} for the live turn
const dead = new Set();  // turns past their terminal event

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight; // still yanks — v3 fixes scroll
  return d;
}

function setBusy(busy) {
  btn.textContent = busy ? "Stop" : "Send";
  btn.classList.toggle("stop", busy);
  box.disabled = busy;
  if (!busy) box.focus();
}

function endTurn(turn_id) {
  dead.add(turn_id);
  liveTurn = null;
  handle = null;
  setBusy(false);
}

function onEvent(ev) {
  if (dead.has(ev.turn_id)) return;           // late-token suppression
  if (liveTurn !== null && ev.turn_id !== liveTurn) return;
  if (ev.type === "turn_start") {
    liveTurn = ev.turn_id;
    current = add("assistant", "");
  } else if (ev.type === "text") {
    if (!current) current = add("assistant", "");
    current.textContent += ev.text;
    log.scrollTop = log.scrollHeight;
  } else if (ev.type === "tool_use") {
    add("tool", "▸ " + ev.name + ": " + ev.label + " …");
    current = null;
  } else if (ev.type === "tool_result") {
    // still the v0 sin: full dump inline — v2 collapses this
    add("tool", ev.content + "\n(" + ev.metrics.duration_ms + "ms)");
    current = null;
  } else if (ev.type === "abort") {
    if (current && !current.textContent) current.remove();
    add("stopped", "⏹ stopped — partial response kept");
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "done") {
    if (current && !current.textContent) current.remove();
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "error" && !ev.recoverable) {
    add("tool", "error: " + ev.text);
    current = null;
    endTurn(ev.turn_id);
  } else {
    // recoverable error still rendered crudely — v3 makes this calm
    add("tool", JSON.stringify(ev));
  }
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (handle) {                     // button is in Stop mode (armed from send, not turn_start)
    handle.stop();
    return;
  }
  if (!box.value.trim()) return;
  add("user", box.value);
  box.value = "";
  setBusy(true);
  handle = agent.send("", onEvent);
});


// vignette: prior turn appears instantly; turn 2 streams and Stop fires
// mid-stream — the partial survives, late events are dropped
window.VIGNETTE = () => {
  agent.preroll(onEvent);
  box.value = "Now rewrite every README";
  document.getElementById("composer").requestSubmit();
  setTimeout(() => { if (handle) handle.stop(); }, 1800);
};
</script>
<script src="/demos/reference-chat/_autoplay.js?v=3"></script>
</body>
</html>
