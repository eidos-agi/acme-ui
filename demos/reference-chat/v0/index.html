<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference chat v0 — the naive baseline · Eidos UI</title>
<style>
  :root {
    --bg: #f0ebe4; --surface: #e4ded6; --ink: #1e1a17; --ink-soft: #8a8078;
    --line: #d4cec6; --accent: #9a6d35; --accent-ink: #faf5ec;
    --user-bg: #e4ded6; --tool-bg: #e9e3da;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: 'Space Grotesk', -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161210; --surface:#1e1a17; --ink:#dcd5cb; --ink-soft:#8b8179;
      --line:#332c26; --accent:#c4935a; --accent-ink:#1e1a17;
      --user-bg:#2a241e; --tool-bg:#211c17; }
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans);
    height: 100dvh; display: flex; flex-direction: column; }
  header { padding: .8rem 1.25rem; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: .8rem; }
  header a { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: .75rem; }
  header .tag { font-family: var(--mono); font-weight: 700; }
  header .note { color: var(--ink-soft); font-size: .8rem; }
  #log { flex: 1; overflow-y: auto; padding: 1.25rem; display: flex;
    flex-direction: column; gap: .8rem; max-width: 46rem; width: 100%; margin: 0 auto; }
  .msg { padding: .6rem .9rem; border-radius: 3px; white-space: pre-wrap;
    line-height: 1.5; font-size: .95rem; }
  .user { background: var(--user-bg); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--surface); border: 1px solid var(--line); align-self: stretch; }
  .tool { background: var(--tool-bg); border: 1px dashed var(--line);
    font-family: var(--mono); font-size: .8rem; color: var(--ink-soft); }
  form { border-top: 1px solid var(--line); padding: .9rem 1.25rem; }
  .row { display: flex; gap: .6rem; max-width: 46rem; margin: 0 auto; }
  input { flex: 1; font: inherit; padding: .55rem .8rem; border-radius: 3px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
  button { font: inherit; padding: .55rem 1.1rem; border-radius: 3px; border: none;
    background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
</style>
</head>
<body>
<header>
  <a href="https://ui.eidosagi.com/">eidos ui</a>
  <a href="../">&larr; versions</a>
  <span class="tag">v0</span>
  <span class="note">the naive baseline — no Stop, raw tool dumps, scroll yanks. That's the lesson.</span>
</header>

<div id="log"></div>

<form id="composer">
  <div class="row">
    <input id="box" value="Audit the repo's broken links and fix them" autocomplete="off">
    <button id="send">Send</button>
  </div>
</form>

<script src="../../mock-ai/v1.js"></script>
<script>
// v0 is a NAIVE CLIENT of the mock agent (../../mock-ai/v1.js, chat-events
// v1.1). Same agent every version talks to — only the rendering grows up.
const log = document.getElementById("log");
const box = document.getElementById("box");
const send = document.getElementById("send");
const agent = MockAI.v1();
let current = null; // current assistant bubble

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight; // v0 sin: always yank to bottom
  return d;
}

function onEvent(ev) {
  if (ev.type === "turn_start") {
    current = add("assistant", "");
  } else if (ev.type === "text") {
    if (!current) current = add("assistant", "");
    current.textContent += ev.text; // v0 sin: no turn check — late tokens would render
    log.scrollTop = log.scrollHeight; // yank on every delta
  } else if (ev.type === "tool_use") {
    add("tool", "▸ " + ev.name + ": " + ev.label + " …");
    current = null;
  } else if (ev.type === "tool_result") {
    // v0 sin: dump the full result inline, no collapse
    add("tool", ev.content + "\n(" + ev.metrics.duration_ms + "ms)");
    current = null;
  } else if (ev.type === "done") {
    if (current && !current.textContent) current.remove();
    current = null;
    send.disabled = false;
    box.disabled = false;
    box.focus();
  } else {
    // v0 sin: no idea what an error is — dump the raw event at the user
    add("tool", JSON.stringify(ev));
  }
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (send.disabled || !box.value.trim()) return;
  add("user", box.value);
  box.value = "";
  send.disabled = true;   // v0 sin: no Stop — you just wait
  box.disabled = true;
  agent.send("", onEvent);
});

// shell autoplay: the shell posts "eidos-play" when its countdown veil lifts
if (new URLSearchParams(location.search).has("autoplay")) {
  let played = false;
  const play = () => {
    if (played) return; played = true;
    const b = document.getElementById("send");
    if (b && !b.disabled) b.click();
  };
  window.addEventListener("message", (e) => { if (e.data === "eidos-play") play(); });
  if (top === self) setTimeout(play, 800);
}
</script>
</body>
</html>
