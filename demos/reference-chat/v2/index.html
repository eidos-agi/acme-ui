<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference chat v2 — who's talking · Eidos UI</title>
<link rel="stylesheet" href="/brand.css?v=6">
<link rel="stylesheet" href="/demos/reference-chat/_base.css?v=6">
<style>
  /* v2 lesson: speaker identity — user accent right, agent left, ends first */
  .user { background: var(--accent); color: var(--accent-ink); align-self: flex-end; max-width: 85%; }
  .assistant { background: var(--surface); border: 1px solid var(--line); align-self: flex-start; max-width: 85%; }
  .tool { background: var(--tool-bg); border: 1px dashed var(--line);
    font-family: var(--mono); font-size: .8rem; color: var(--ink-soft);
    align-self: flex-start; max-width: 85%; }
</style>
</head>
<body>
<header>
  <a href="https://ui.eidosagi.com/">eidos ui</a>
  <a href="../">&larr; versions</a>
  <span class="tag">v2</span>
  <span class="note">who's talking — your words in your color on the right, the agent's on the left, ending before yours begin. Raw dumps and scroll yanks still ahead.</span>
</header>

<div id="log"></div>

<form id="composer">
  <div class="row">
    <input id="box" value="Audit the repo's broken links and fix them" autocomplete="off">
    <button id="btn" type="submit">Send</button>
  </div>
</form>

<script src="/demos/mock-ai/v1.js?v=6"></script>
<script>
// v2 fixes SPEAKER IDENTITY on top of v1 (founder feedback 2026-08-03:
// bubbles didn't make it obvious who is talking, and agent bubbles shared
// the user's right edge). User = accent, right. Agent = surface, left,
// max-width so it ends before user bubbles begin.
// v1 gave CONTROL: send/stop same-slot morph, abort keeps the
// partial, and events for a dead turn are dropped (late-token suppression,
// keyed on turn_id — the trap the mock sets after stop()).
// Still v0-crude on purpose: raw tool dumps inline (v2), scroll yank +
// error grace (v3).
const log = document.getElementById("log");
const box = document.getElementById("box");
const btn = document.getElementById("btn");
const agent = MockAI.v1();
let current = null;      // current assistant bubble
let liveTurn = null;     // turn_id we accept events for
let handle = null;       // {stop()} for the live turn
const dead = new Set();  // turns past their terminal event

function add(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight; // still yanks — v3 fixes scroll
  return d;
}

function setBusy(busy) {
  btn.textContent = busy ? "Stop" : "Send";
  btn.classList.toggle("stop", busy);
  box.disabled = busy;
  if (!busy) box.focus();
}

function endTurn(turn_id) {
  dead.add(turn_id);
  liveTurn = null;
  handle = null;
  setBusy(false);
}

function onEvent(ev) {
  if (dead.has(ev.turn_id)) return;           // late-token suppression
  if (liveTurn !== null && ev.turn_id !== liveTurn) return;
  if (ev.type === "turn_start") {
    liveTurn = ev.turn_id;
    current = add("assistant", "");
  } else if (ev.type === "text") {
    if (!current) current = add("assistant", "");
    current.textContent += ev.text;
    log.scrollTop = log.scrollHeight;
  } else if (ev.type === "tool_use") {
    add("tool", "▸ " + ev.name + ": " + ev.label + " …");
    current = null;
  } else if (ev.type === "tool_result") {
    // still the v0 sin: full dump inline — v2 collapses this
    add("tool", ev.content + "\n(" + ev.metrics.duration_ms + "ms)");
    current = null;
  } else if (ev.type === "abort") {
    if (current && !current.textContent) current.remove();
    add("stopped", "⏹ stopped — partial response kept");
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "done") {
    if (current && !current.textContent) current.remove();
    current = null;
    endTurn(ev.turn_id);
  } else if (ev.type === "error" && !ev.recoverable) {
    add("tool", "error: " + ev.text);
    current = null;
    endTurn(ev.turn_id);
  } else {
    // recoverable error still rendered crudely — v3 makes this calm
    add("tool", JSON.stringify(ev));
  }
}

document.getElementById("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  if (handle) {                     // button is in Stop mode (armed from send, not turn_start)
    handle.stop();
    return;
  }
  if (!box.value.trim()) return;
  const typed = box.value;
  add("user", typed);
  box.value = "";
  setBusy(true);
  handle = agent.send(typed, onEvent);
});


// vignette: nothing to animate — speaker identity is visible the instant
// the seeded conversation renders
window.VIGNETTE = () => { agent.preroll(onEvent); };
</script>
<script src="/demos/reference-chat/_autoplay.js?v=6"></script>
</body>
</html>
